name: Apply SILK Quiet Futurism once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  reskin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: silk-os-v0.6/package-lock.json

      - name: Apply scoped Quiet Futurism skin
        working-directory: silk-os-v0.6
        run: python3 scripts/reskin-quiet-futurism-once.py

      - name: Prepare SILK scripts
        working-directory: silk-os-v0.6
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        working-directory: silk-os-v0.6
        run: npm run install:ci

      - name: Lint
        working-directory: silk-os-v0.6
        run: npm run lint

      - name: Verified production build
        working-directory: silk-os-v0.6
        run: npm run build

      - name: Run tests
        working-directory: silk-os-v0.6
        run: node --test tests/*.test.mjs

      - name: Commit verified Quiet Futurism reskin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            silk-os-v0.6/app/calendar/calendar.module.css \
            silk-os-v0.6/app/calendar-bridge.module.css \
            silk-os-v0.6/worker/index.ts
          git diff --cached --quiet && exit 0
          git commit -m "Reskin scoped SILK surfaces to Quiet Futurism"
          git push

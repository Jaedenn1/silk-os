name: Integrate SILK operating loop once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: silk-os-v0.6/package-lock.json

      - name: Integrate Momentum, adaptive time, proactive SILK and screensaver
        working-directory: silk-os-v0.6
        run: python3 scripts/integrate-operating-loop-once.py

      - name: Prepare SILK scripts
        working-directory: silk-os-v0.6
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        working-directory: silk-os-v0.6
        run: npm run install:ci

      - name: Diagnose lint
        working-directory: silk-os-v0.6
        shell: bash
        run: |
          set +e
          npm run lint > ../operating-loop-lint.txt 2>&1
          echo $? > ../operating-loop-lint-exit.txt
          exit 0

      - name: Diagnose build
        working-directory: silk-os-v0.6
        shell: bash
        run: |
          set +e
          npm run build > ../operating-loop-build.txt 2>&1
          echo $? > ../operating-loop-build-exit.txt
          exit 0

      - name: Diagnose tests
        working-directory: silk-os-v0.6
        shell: bash
        run: |
          set +e
          node --test tests/*.test.mjs > ../operating-loop-tests.txt 2>&1
          echo $? > ../operating-loop-tests-exit.txt
          exit 0

      - name: Commit diagnostics only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operating-loop-lint.txt operating-loop-lint-exit.txt operating-loop-build.txt operating-loop-build-exit.txt operating-loop-tests.txt operating-loop-tests-exit.txt
          git commit -m "Capture complete operating loop diagnostics"
          git push

name: Integrate SILK operating loop once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: silk-os-v0.6/package-lock.json

      - name: Integrate Momentum, adaptive time, proactive SILK and screensaver
        working-directory: silk-os-v0.6
        run: python3 scripts/integrate-operating-loop-once.py

      - name: Prepare SILK scripts
        working-directory: silk-os-v0.6
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        working-directory: silk-os-v0.6
        run: npm run install:ci

      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: silk-os-v0.6
        run: npm run lint 2>&1 | tee ../operating-loop-lint.txt

      - name: Capture lint diagnostics
        if: steps.lint.outcome == 'failure'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operating-loop-lint.txt
          git commit -m "Capture operating loop lint diagnostics"
          git push

      - name: Stop on lint failure
        if: steps.lint.outcome == 'failure'
        run: exit 1

      - name: Verified production build
        working-directory: silk-os-v0.6
        run: npm run build

      - name: Run tests
        working-directory: silk-os-v0.6
        run: node --test tests/*.test.mjs

      - name: Commit verified operating loop
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            silk-os-v0.6/app/page.tsx \
            silk-os-v0.6/app/silk-os.tsx \
            silk-os-v0.6/app/today-v2-bridge.tsx \
            silk-os-v0.6/app/momentum-bridge.tsx \
            silk-os-v0.6/worker/index.ts \
            silk-os-v0.6/worker/silk-time-engine.js \
            silk-os-v0.6/worker/silk-proactive.js \
            silk-os-v0.6/worker/silk-life-chat.js \
            silk-os-v0.6/worker/silk-completions.js \
            silk-os-v0.6/tests/time-engine.test.mjs \
            silk-os-v0.6/HIGH-PRIORITY-3D-INSPIRATION-SCREENSAVER.md
          git diff --cached --quiet && exit 0
          git commit -m "Integrate Momentum adaptive time proactive SILK and screensaver"
          git push

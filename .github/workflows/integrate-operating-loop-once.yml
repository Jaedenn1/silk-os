name: Integrate SILK operating loop once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: silk-os-v0.6/package-lock.json

      - name: Integrate operating loop
        working-directory: silk-os-v0.6
        run: |
          python3 scripts/integrate-operating-loop-once.py
          python3 scripts/fix-operating-loop-diagnostics.py

      - name: Prepare SILK scripts
        working-directory: silk-os-v0.6
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        working-directory: silk-os-v0.6
        run: npm run install:ci

      - name: Lint
        working-directory: silk-os-v0.6
        run: npm run lint

      - name: Diagnose production build
        working-directory: silk-os-v0.6
        shell: bash
        run: |
          set +e
          npm run build > ../operating-loop-build2.txt 2>&1
          echo $? > ../operating-loop-build2-exit.txt
          exit 0

      - name: Commit build diagnostic only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add operating-loop-build2.txt operating-loop-build2-exit.txt
          git commit -m "Capture post-fix operating loop build diagnostic"
          git push

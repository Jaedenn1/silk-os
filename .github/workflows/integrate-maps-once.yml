name: Integrate SILK maps once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: npm
          cache-dependency-path: silk-os-v0.6/package-lock.json

      - name: Wire maps into SILK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # Worker routing.
          replace_once(
              "silk-os-v0.6/worker/index.ts",
              'import { tryHandleSilkCalendarChat } from "./silk-calendar-chat.js";\nimport { classifyAutomaticChatTier, routeAutomaticModelEnv } from "./model-routing.js";',
              'import { tryHandleSilkCalendarChat } from "./silk-calendar-chat.js";\nimport { handleSilkMaps, mapsErrorResponse } from "./silk-maps.js";\nimport { classifyAutomaticChatTier, routeAutomaticModelEnv } from "./model-routing.js";',
          )

          replace_once(
              "silk-os-v0.6/worker/index.ts",
              '  TAVILY_API_KEY?: string;\n  GOOGLE_CLIENT_ID?: string;',
              '  TAVILY_API_KEY?: string;\n  MAPS_GEOCODER_URL?: string;\n  MAPS_ROUTER_URL?: string;\n  MAPS_TILE_STYLE_URL?: string;\n  GOOGLE_CLIENT_ID?: string;',
          )

          replace_once(
              "silk-os-v0.6/worker/index.ts",
              '''    if (url.pathname.startsWith("/api/") || url.pathname === "/manifest.webmanifest") {''',
              '''    if (url.pathname.startsWith("/api/maps/")) {
      if (!(await ownerSessionIsAuthenticated(request, env, ctx))) {
        return withSecurityHeaders(new Response(JSON.stringify({ error: "Unlock SILK before using maps." }), {
          status: 401,
          headers: { "Content-Type": "application/json; charset=utf-8", "Cache-Control": "no-store" },
        }));
      }
      try {
        return withSecurityHeaders(await handleSilkMaps(request, env));
      } catch (error) {
        return withSecurityHeaders(mapsErrorResponse(error));
      }
    }

    if (url.pathname.startsWith("/api/") || url.pathname === "/manifest.webmanifest") {''',
          )

          # Today imports and types.
          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''  ListChecks,
  Plus,
  RefreshCw,''',
              '''  ListChecks,
  MapPin,
  Navigation,
  Plus,
  RefreshCw,''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''import { createPortal } from "react-dom";
import styles from "./today-v2.module.css";''',
              '''import { createPortal } from "react-dom";
import SilkRouteMap from "./components/silk-route-map";
import styles from "./today-v2.module.css";''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''type SleepSignal = { event: CalendarEvent; wakeAt: number; bedtime: number; windDown: number };''',
              '''type SleepSignal = { event: CalendarEvent; wakeAt: number; bedtime: number; windDown: number };
type RouteEstimate = {
  eventId: number;
  origin: { lat: number; lon: number };
  destination: { lat: number; lon: number; label: string; query: string };
  travel_minutes: number;
  travel_seconds: number;
  distance_km: number;
  geometry: { type: "LineString"; coordinates: number[][] } | null;
  map_style_url: string;
  cached: boolean;
  estimate: boolean;
};''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''function planEvent(event: CalendarEvent): EventPlan | null {
  if (event.all_day || !event.start_at) return null;
  const prepOverride = noteMinutes(event.notes, "prep");
  const travelOverride = noteMinutes(event.notes, "travel");
  const prepMinutes = prepOverride ?? DEFAULT_PREP[event.category] ?? 10;
  const travelMinutes = travelOverride ?? (event.location.trim() ? 30 : 0);
  const leaveBy = event.start_at - travelMinutes * 60;
  return {
    prepMinutes,
    travelMinutes,
    leaveBy,
    prepStart: leaveBy - prepMinutes * 60,
    estimatedTravel: travelOverride === null && travelMinutes > 0,
  };
}''',
              '''function planEvent(event: CalendarEvent, liveRoute?: RouteEstimate | null): EventPlan | null {
  if (event.all_day || !event.start_at) return null;
  const prepOverride = noteMinutes(event.notes, "prep");
  const travelOverride = noteMinutes(event.notes, "travel");
  const liveTravel = liveRoute?.eventId === event.id ? liveRoute.travel_minutes : null;
  const prepMinutes = prepOverride ?? DEFAULT_PREP[event.category] ?? 10;
  const travelMinutes = travelOverride ?? liveTravel ?? (event.location.trim() ? 30 : 0);
  const leaveBy = event.start_at - travelMinutes * 60;
  return {
    prepMinutes,
    travelMinutes,
    leaveBy,
    prepStart: leaveBy - prepMinutes * 60,
    estimatedTravel: travelOverride === null && liveTravel === null && travelMinutes > 0,
  };
}''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''  const [newTask, setNewTask] = useState("");
  const [error, setError] = useState("");
  const [, setTick] = useState(0);''',
              '''  const [newTask, setNewTask] = useState("");
  const [error, setError] = useState("");
  const [routeEstimate, setRouteEstimate] = useState<RouteEstimate | null>(null);
  const [routeBusy, setRouteBusy] = useState(false);
  const [, setTick] = useState(0);''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''      plan: planEvent(event),''',
              '''      plan: planEvent(event, routeEstimate),''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''  }, [data, todayEvents]);

  const conflicts = useMemo<Conflict[]>(() => {''',
              '''  }, [data, routeEstimate, todayEvents]);

  const conflicts = useMemo<Conflict[]>(() => {''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''  const nextLogistics = useMemo(() => {
    const now = Date.now() / 1000;
    const upcoming = timeline.find((item) => item.source === "calendar" && item.start !== null && Number(item.start) > now && item.plan);
    return upcoming || null;
  }, [timeline]);

  const bestFit = useMemo(() => {''',
              '''  const nextLogistics = useMemo(() => {
    const now = Date.now() / 1000;
    const upcoming = timeline.find((item) => item.source === "calendar" && item.start !== null && Number(item.start) > now && item.plan);
    return upcoming || null;
  }, [timeline]);

  const routeTarget = useMemo(() => {
    const now = Date.now() / 1000;
    return [...todayEvents]
      .filter((event) => !event.all_day && event.start_at > now && Boolean(event.location.trim()))
      .sort((a, b) => a.start_at - b.start_at)[0] || null;
  }, [todayEvents]);

  const liveRoute = routeEstimate && routeTarget && routeEstimate.eventId === routeTarget.id ? routeEstimate : null;

  const bestFit = useMemo(() => {''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''  const openView = useCallback((name: string) => findNavButton(name)?.click(), []);''',
              '''  const requestLiveRoute = useCallback(() => {
    if (!routeTarget || routeBusy) return;
    if (!navigator.geolocation) {
      setError("This browser does not expose device location to SILK.");
      return;
    }

    setRouteBusy(true);
    setError("");
    navigator.geolocation.getCurrentPosition(
      (position) => {
        void (async () => {
          try {
            const response = await fetch("/api/maps/route", {
              method: "POST",
              credentials: "same-origin",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                origin: { lat: position.coords.latitude, lon: position.coords.longitude },
                destination: routeTarget.location,
                mode: "auto",
              }),
            });
            const payload = await response.json().catch(() => ({})) as Omit<RouteEstimate, "eventId"> & { error?: string };
            if (!response.ok) throw new Error(payload.error || "SILK could not calculate that route.");
            setRouteEstimate({ ...payload, eventId: routeTarget.id });
          } catch (routeError) {
            setError(routeError instanceof Error ? routeError.message : "SILK could not calculate that route.");
          } finally {
            setRouteBusy(false);
          }
        })();
      },
      (locationError) => {
        setRouteBusy(false);
        setError(locationError.code === 1
          ? "Location permission was not granted. SILK will keep the fallback travel estimate."
          : "SILK could not read your current location. The fallback travel estimate is still active.");
      },
      { enableHighAccuracy: false, timeout: 10_000, maximumAge: 5 * 60_000 },
    );
  }, [routeBusy, routeTarget]);

  const openView = useCallback((name: string) => findNavButton(name)?.click(), []);''',
          )

          replace_once(
              "silk-os-v0.6/app/today-v2-bridge.tsx",
              '''          <p className={styles.estimateNote}>Travel defaults to 30 min when a Calendar event has a location. Add <code>travel:45</code> or <code>prep:20</code> to event notes to override the estimate until live routing is connected.</p>
        </article>

        <article className={`${styles.card} ${styles.checkinCard}`}>''',
              '''          <p className={styles.estimateNote}>Travel falls back to 30 min when a Calendar event has a location but no live route is active. Add <code>travel:45</code> or <code>prep:20</code> to event notes for an explicit override.</p>
        </article>

        <article className={`${styles.card} ${styles.routeCard}`}>
          <div className={styles.cardHeading}><div><span>LIVE ROUTE</span><h2>Maps & travel time</h2></div><Navigation size={18} /></div>
          {routeTarget ? liveRoute ? <div className={styles.routeLive}>
            <SilkRouteMap origin={liveRoute.origin} destination={liveRoute.destination} geometry={liveRoute.geometry} styleUrl={liveRoute.map_style_url} />
            <div className={styles.routeFacts}>
              <div><span>Drive</span><strong>{liveRoute.travel_minutes} min</strong></div>
              <div><span>Distance</span><strong>{liveRoute.distance_km.toFixed(1)} km</strong></div>
              <div><span>Leave by</span><strong>{clock(routeTarget.start_at - liveRoute.travel_minutes * 60)}</strong></div>
            </div>
            <div className={styles.routeDestination}><MapPin size={13} /><div><strong>{routeTarget.title}</strong><small>{liveRoute.destination.label}</small></div></div>
            <button className={styles.routeButton} onClick={requestLiveRoute} disabled={routeBusy}><Navigation size={14} /> {routeBusy ? "Routing…" : "Refresh from current location"}</button>
            <small className={styles.routeAttribution}>OpenFreeMap · OpenStreetMap contributors · Photon · Valhalla</small>
          </div> : <div className={styles.routePrompt}>
            <span className={styles.routeIcon}><MapPin size={18} /></span>
            <div><strong>{routeTarget.title}</strong><small>{routeTarget.location}</small></div>
            <p>Use your device location to replace SILK’s fallback travel buffer with a real OpenStreetMap route. Your precise position is requested only when you press the button.</p>
            <button className={styles.routeButton} onClick={requestLiveRoute} disabled={routeBusy}><Navigation size={14} /> {routeBusy ? "Calculating route…" : "Use current location"}</button>
          </div> : <p className={styles.empty}>No upcoming timed Calendar event has a location to route to.</p>}
        </article>

        <article className={`${styles.card} ${styles.checkinCard}`}>''',
          )

          # Today route styling.
          css = Path("silk-os-v0.6/app/today-v2.module.css")
          text = css.read_text()
          marker = '.checkinList{position:relative;z-index:2;display:grid;gap:8px}'
          if text.count(marker) != 1:
              raise SystemExit(f"Expected one route CSS insertion marker, found {text.count(marker)}")
          route_css = '''.routeCard{grid-column:1/-1;background:radial-gradient(circle at 84% 0%,rgba(105,91,255,.08),transparent 31%),linear-gradient(145deg,rgba(14,16,25,.92),rgba(8,9,14,.95))}.routeLive{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(250px,.55fr);gap:12px}.routeLive>div:first-child{grid-row:1/span 4}.routeFacts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.routeFacts>div{display:grid;gap:4px;padding:9px;border:1px solid rgba(185,180,218,.09);border-radius:10px;background:rgba(255,255,255,.014)}.routeFacts span{font:700 7px var(--font-geist-mono),monospace;letter-spacing:.1em;text-transform:uppercase;color:#6f6b7b}.routeFacts strong{font-size:11px;color:#d9d5e4}.routeDestination{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;padding:9px 10px;border:1px solid rgba(185,180,218,.08);border-radius:10px;color:#9f94df}.routeDestination>div{display:grid;gap:3px}.routeDestination strong{font-size:9px;color:#d7d3df}.routeDestination small{font-size:7px;color:#706d7b}.routePrompt{position:relative;z-index:2;max-width:680px;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px}.routePrompt>p,.routePrompt>.routeButton{grid-column:1/-1}.routePrompt>div{display:grid;gap:3px}.routePrompt strong{font-size:11px;color:#ddd9e7}.routePrompt small{font-size:8px;color:#777381}.routePrompt p{margin:4px 0;color:#777381;font-size:8px;line-height:1.6}.routeIcon{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(151,137,255,.18);border-radius:12px;background:rgba(123,104,236,.055);color:#aa9cff}.routeButton{width:max-content;min-height:34px;padding:0 11px;display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(153,142,255,.24);border-radius:9px;background:linear-gradient(145deg,rgba(93,86,193,.3),rgba(53,48,118,.36));color:#d9d1ff;font-size:8px;cursor:pointer}.routeButton:disabled{opacity:.45;cursor:default}.routeAttribution{align-self:end;color:#555260;font-size:6px;line-height:1.4}

'''
          css.write_text(text.replace(marker, route_css + marker, 1))
          PY

      - name: Add MapLibre dependency
        working-directory: silk-os-v0.6
        run: npm install --save-exact --package-lock-only maplibre-gl@6.13.0

      - name: Prepare SILK scripts
        working-directory: silk-os-v0.6
        run: chmod +x scripts/*.sh

      - name: Install dependencies
        working-directory: silk-os-v0.6
        run: npm run install:ci

      - name: Lint
        working-directory: silk-os-v0.6
        run: npm run lint

      - name: Verified production build
        working-directory: silk-os-v0.6
        run: npm run build

      - name: Run tests
        working-directory: silk-os-v0.6
        run: node --test tests/*.test.mjs

      - name: Commit verified maps integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silk-os-v0.6/package.json silk-os-v0.6/package-lock.json silk-os-v0.6/worker/index.ts silk-os-v0.6/app/today-v2-bridge.tsx silk-os-v0.6/app/today-v2.module.css
          git diff --cached --quiet && exit 0
          git commit -m "Integrate live open-source maps into Today V2"
          git push

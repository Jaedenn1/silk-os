name: Apply SILK router fix once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/router-fix-once.yml"

permissions:
  contents: write

jobs:
  patch-router:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch automatic routing and regression tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          core_path = Path("silk-os-v0.6/worker/silk-core.js")
          tests_path = Path("silk-os-v0.6/tests/silk-core.test.mjs")

          core = core_path.read_text()
          new_router = r'''function chooseModel(message, mode = "automatic", task = "chat", env = {}) {
            let tier = "routine";
            if (task === "memory_extract" || task === "provider_diagnostic") tier = "micro";
            else if (task === "study_parse" || mode === "best") tier = "complex";
            else if (mode === "efficient" || task === "calendar_parse") {
              tier = "routine";
            } else {
              const text = String(message || "").trim();
              const microPattern =
                /^(?:hi|hello|hey|thanks|thank you|good (?:morning|afternoon|evening)|what(?:'s| is) next|mark .+ done|show .+|open .+|status)\b/i;
              const simpleArithmetic =
                text.length <= 120 && /(?:^|\b)(?:what(?:'s| is)\s+)?\d+(?:\.\d+)?\s*[+\-*/]\s*\d+(?:\.\d+)?/i.test(text);
              const strongComplexPattern =
                /\b(architecture|code review|debug(?:ging)?|root cause|trade-?offs?|system design|research plan|deep analysis|diagnos(?:e|is)|multi-step|step-by-step strategy)\b/i;
              const complexityPatterns = [
                /\bcompare\b/i,
                /\banaly[sz]e\b/i,
                /\bevidence\b/i,
                /\brecommend\b/i,
                /\bevaluate\b/i,
                /\btrade-?offs?\b/i,
                /\bstrategy\b/i,
                /\bdesign\b/i,
                /\barchitecture\b/i,
                /\bdebug(?:ging)?\b/i,
                /\bcode review\b/i,
              ];
              const complexitySignals = complexityPatterns.reduce(
                (total, pattern) => total + (pattern.test(text) ? 1 : 0),
                0,
              );
              const compoundComplexity = complexitySignals >= 3 ||
                (complexitySignals >= 2 && text.length > 140);
              const longComplexity = text.length > 500;

              if (strongComplexPattern.test(text) || compoundComplexity || longComplexity) tier = "complex";
              else if (text.length <= 120 && (microPattern.test(text) || simpleArithmetic)) tier = "micro";
              else tier = "routine";
            }
            return primaryAIProvider(env) === "openai"
              ? resolveOpenAIModel(env, tier)
              : resolveCloudflareModel(tier);
          }'''

          updated_core, count = re.subn(
              r'function chooseModel\(message, mode = "automatic", task = "chat", env = \{\}\) \{.*?\n\}\n\nfunction responseTokenLimit',
              new_router + '\n\nfunction responseTokenLimit',
              core,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"Expected to replace chooseModel once, replaced {count} times")
          core_path.write_text(updated_core)

          tests = tests_path.read_text()
          marker = 'test("authentication comparison rejects wrong values and length mismatches", () => {'
          if marker not in tests:
              raise SystemExit("Could not find test insertion marker")
          regression = r'''test("automatic routing avoids unnecessary Terra escalation", () => {
            assert.equal(
              chooseModel("What is 15 + 27? Answer with only the number.", "automatic", "chat", openAIEnv).id,
              "gpt-5-nano",
            );
            assert.equal(
              chooseModel("Explain in two sentences why sleep is important.", "automatic", "chat", openAIEnv).id,
              "gpt-5.6-luna",
            );
            assert.equal(
              chooseModel("Why is sleep important?", "automatic", "chat", openAIEnv).id,
              "gpt-5.6-luna",
            );
            assert.equal(
              chooseModel("Debug this Cloudflare Worker deployment and identify the root cause.", "automatic", "chat", openAIEnv).id,
              "gpt-5.6-terra",
            );
          });

          test("manual routing modes remain authoritative", () => {
            assert.equal(chooseModel("Hello", "efficient", "chat", openAIEnv).id, "gpt-5.6-luna");
            assert.equal(chooseModel("Hello", "best", "chat", openAIEnv).id, "gpt-5.6-terra");
          });

          '''
          if 'automatic routing avoids unnecessary Terra escalation' not in tests:
              tests = tests.replace(marker, regression + marker, 1)
          tests_path.write_text(tests)
          PY

      - name: Install SILK dependencies
        run: npm --prefix silk-os-v0.6 ci

      - name: Run SILK test suite
        run: npm --prefix silk-os-v0.6 test

      - name: Commit verified router fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silk-os-v0.6/worker/silk-core.js silk-os-v0.6/tests/silk-core.test.mjs
          if git diff --cached --quiet; then
            echo "Router fix already applied."
            exit 0
          fi
          git commit -m "Tune SILK automatic model routing"
          git push origin HEAD:main
